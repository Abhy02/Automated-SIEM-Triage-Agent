version: '3.8'

services:
  aisoc-app:
    build: .
    container_name: aisoc-enterprise
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=aisoc-enterprise-secret-key-prod-2026-v4
      - DEMO_MODE=true
    volumes:
      - ./aisoc.db:/app/aisoc.db
      - ./reports:/app/reports
    restart: always
